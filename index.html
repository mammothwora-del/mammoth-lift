<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mammoth Lift</title>
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mammoth">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --surface:#191D26; --surface2:#232833; --border:#2E3440;
    --text:#EDEFF2; --muted:#9AA0AC; --faint:#6B7280;
    --ember:#FF5436; --ember-soft:rgba(255,84,54,.14);
    --gold:#FFC24B; --gold-soft:rgba(255,194,75,.15);
    --green:#3DDC97; --green-soft:rgba(61,220,151,.14);
    --disp:'Kanit',system-ui,sans-serif;
    --body:'IBM Plex Sans Thai','Kanit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font-family:var(--body);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 96px}

  header{padding:22px 4px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--ember),#c0341c);
    display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:20px;color:#fff;
    box-shadow:0 6px 18px -6px var(--ember)}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.3px;margin:0;line-height:1}
  .brand span{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
  .streak{text-align:right;font-family:var(--disp)}
  .streak b{font-size:26px;font-weight:800;line-height:1;display:block;color:var(--gold)}
  .streak small{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}

  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:4px;margin:6px 0 18px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--disp);font-weight:600;
    font-size:14px;padding:10px;border-radius:9px;cursor:pointer;transition:.18s;letter-spacing:.3px}
  .seg button.on{background:var(--surface2);color:var(--text);box-shadow:0 2px 8px -3px #000}

  .rail{display:flex;gap:9px;overflow-x:auto;padding:2px 16px 14px;scrollbar-width:none;margin:0 -16px}
  .rail::-webkit-scrollbar{display:none}
  .daycard{flex:0 0 auto;min-width:88px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:12px 13px;cursor:pointer;transition:.18s;position:relative}
  .daycard .dn{font-family:var(--disp);font-size:11px;font-weight:600;color:var(--faint);letter-spacing:1px}
  .daycard .dt{font-family:var(--disp);font-weight:700;font-size:15px;margin-top:3px;line-height:1.15;white-space:nowrap}
  .daycard .dtag{font-size:10.5px;color:var(--muted);margin-top:2px}
  .daycard.on{border-color:var(--ember);background:linear-gradient(160deg,var(--ember-soft),transparent)}
  .daycard.on .dn{color:var(--ember)}
  .daycard .dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 14px}
  .dayhead h2{font-family:var(--disp);font-weight:700;font-size:21px;margin:0}
  .dayhead .cnt{font-size:12.5px;color:var(--muted)}

  .ex{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 15px 13px;margin-bottom:13px;
    animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-name{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.2}
  .ex-th{font-size:12px;color:var(--muted);margin-top:2px}
  .ex-target{flex:0 0 auto;text-align:right;font-family:var(--disp);font-size:12px;color:var(--faint);white-space:nowrap;padding-top:2px}
  .ex-target b{display:block;color:var(--text);font-size:15px;font-weight:700}
  .last{font-size:11.5px;color:var(--muted);margin:9px 0 4px;display:flex;align-items:center;gap:6px}
  .last .lg{color:var(--faint)}
  .pr{margin-left:auto;background:var(--gold-soft);color:var(--gold);font-family:var(--disp);font-weight:700;
    font-size:10.5px;padding:3px 8px;border-radius:20px;letter-spacing:.4px;animation:pop .3s both}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

  .sets{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .setrow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center}
  .snum{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--faint);text-align:center}
  .fields{display:flex;gap:8px;align-items:center}
  .fld{flex:1;position:relative}
  .fld input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:var(--disp);font-weight:600;font-size:16px;text-align:center;
    padding:11px 6px;outline:none;transition:.15s}
  .fld input:focus{border-color:var(--ember);background:#262c38}
  .fld input::placeholder{color:var(--faint);font-weight:400}
  .fld label{position:absolute;top:-7px;left:9px;background:var(--surface);padding:0 5px;font-size:9.5px;
    color:var(--faint);letter-spacing:.5px;font-family:var(--disp);border-radius:4px}
  .x{color:var(--faint);font-family:var(--disp);font-weight:600;font-size:13px}
  .chk{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface2);
    display:grid;place-items:center;cursor:pointer;transition:.15s;flex:0 0 auto}
  .chk svg{width:19px;height:19px;stroke:var(--faint);stroke-width:2.6;fill:none;transition:.15s}
  .setrow.done .chk{background:var(--green);border-color:var(--green)}
  .setrow.done .chk svg{stroke:#0E1116}
  .setrow.done input{border-color:var(--green-soft);color:var(--green)}
  .chk:active{transform:scale(.9)}

  .addset{margin-top:11px;width:100%;background:transparent;border:1.5px dashed var(--border);color:var(--muted);
    font-family:var(--disp);font-weight:600;font-size:13px;padding:10px;border-radius:11px;cursor:pointer;transition:.15s}
  .addset:active{background:var(--surface2)}

  .hcard{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:12px;animation:rise .3s both}
  .hcard .hd{display:flex;justify-content:space-between;align-items:center}
  .hdate{font-family:var(--disp);font-weight:700;font-size:15px}
  .hday{font-size:11.5px;color:var(--ember);font-family:var(--disp);font-weight:600;margin-top:2px}
  .hvol{text-align:right;font-family:var(--disp)}
  .hvol b{font-size:19px;font-weight:800;color:var(--gold);line-height:1}
  .hvol small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .hex{margin-top:11px;padding-top:11px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .hex-row{display:flex;justify-content:space-between;font-size:12.5px}
  .hex-row span:first-child{color:var(--text)}
  .hex-row span:last-child{color:var(--muted);font-family:var(--disp);font-weight:600}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .ico{font-size:40px;margin-bottom:12px;opacity:.5}
  .empty p{font-size:14px;line-height:1.6}
  .empty b{color:var(--text);font-family:var(--disp);display:block;font-size:17px;margin-bottom:6px}

  .savenote{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
    bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--disp);
    font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:9;
    box-shadow:0 8px 24px -8px #000}
  .savenote.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .savenote .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}

  .install{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;
    background:linear-gradient(150deg,var(--ember),#c0341c);color:#fff;border:0;border-radius:14px;padding:14px;
    font-family:var(--disp);font-weight:700;font-size:15px;cursor:pointer;z-index:10;display:none;
    box-shadow:0 10px 28px -8px var(--ember);align-items:center;justify-content:center;gap:8px}
  .install.show{display:flex;animation:rise .3s both}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>MAMMOTH LIFT</h1>
        <span>Recomp · 5-Day Split</span>
      </div>
    </div>
    <div class="streak">
      <b id="streakN">0</b>
      <small>วันติด 🔥</small>
    </div>
  </header>

  <div class="seg">
    <button id="tabWork" class="on" onclick="setView('workout')">ออกกำลังกาย</button>
    <button id="tabHist" onclick="setView('history')">ประวัติ</button>
  </div>

  <div id="workoutView">
    <div class="rail" id="rail"></div>
    <div class="dayhead">
      <h2 id="dayTitle"></h2>
      <span class="cnt" id="dayCnt"></span>
    </div>
    <div id="exList"></div>
  </div>

  <div id="historyView" style="display:none"></div>
</div>

<button class="install" id="installBtn">⬇ ติดตั้งแอปลงเครื่อง</button>
<div class="savenote" id="savenote"><span class="d"></span>บันทึกแล้ว</div>

<script>
const STORE_KEY='mammoth-workout-v1';
const PLAN={
  1:{title:'อก + หลังแขน',tag:'Push',ex:[
    {id:'d1a',n:'Dumbbell Floor Press',th:'นอนพื้นดันดัมเบล',s:4,r:'8-12',t:'db'},
    {id:'d1b',n:'Incline DB Press',th:'ดันอกเอียง',s:3,r:'10-12',t:'db'},
    {id:'d1c',n:'Push-ups',th:'วิดพื้น',s:3,r:'สุดแรง',t:'bw'},
    {id:'d1d',n:'DB Chest Fly',th:'บินอก',s:3,r:'12-15',t:'db'},
    {id:'d1e',n:'Overhead Tri Extension',th:'เหยียดหลังแขนเหนือหัว',s:3,r:'12',t:'db'},
    {id:'d1f',n:'Bench Dips',th:'จุ่มหลังแขน',s:3,r:'12-15',t:'bw'},
    {id:'d1g',n:'Push-up Burnout',th:'วิดพื้นปิดท้าย',s:2,r:'สุดแรง',t:'bw'},
  ]},
  2:{title:'หลัง + หน้าแขน',tag:'Pull',ex:[
    {id:'d2a',n:'One-Arm DB Row',th:'โยกแถวมือเดียว',s:4,r:'10-12',t:'db'},
    {id:'d2b',n:'Bent-over DB Row',th:'โยกแถวสองมือ',s:3,r:'10',t:'db'},
    {id:'d2c',n:'DB Romanian Deadlift',th:'RDL โน้มตัวหลังตรง',s:3,r:'10-12',t:'db'},
    {id:'d2d',n:'DB Pullover',th:'พูลโอเวอร์',s:3,r:'12',t:'db'},
    {id:'d2e',n:'Bicep Curl',th:'เคิร์ลหน้าแขน',s:3,r:'12',t:'db'},
    {id:'d2f',n:'Hammer Curl',th:'แฮมเมอร์เคิร์ล',s:3,r:'12',t:'db'},
    {id:'d2g',n:'Superman',th:'ซุปเปอร์แมน (หลังล่าง)',s:3,r:'15',t:'bw'},
  ]},
  3:{title:'ขา + ก้น',tag:'Legs',ex:[
    {id:'d3a',n:'Goblet Squat',th:'สควอทอุ้มดัมเบล',s:4,r:'10-12',t:'db'},
    {id:'d3b',n:'Bulgarian Split Squat',th:'สปลิทสควอท /ข้าง',s:3,r:'10',t:'db'},
    {id:'d3c',n:'DB Romanian Deadlift',th:'RDL',s:3,r:'12',t:'db'},
    {id:'d3d',n:'Walking Lunges',th:'เดินย่อ /ข้าง',s:3,r:'12',t:'db'},
    {id:'d3e',n:'Calf Raise',th:'เขย่งน่อง',s:4,r:'15-20',t:'db'},
    {id:'d3f',n:'Glute Bridge',th:'สะพานก้น',s:3,r:'15',t:'db'},
    {id:'d3g',n:'Jump Squat',th:'สควอทกระโดด',s:3,r:'15',t:'bw'},
  ]},
  4:{title:'ไหล่ + แขน',tag:'Shoulders',ex:[
    {id:'d4a',n:'DB Overhead Press',th:'ดันไหล่เหนือหัว',s:4,r:'8-12',t:'db'},
    {id:'d4b',n:'Lateral Raise',th:'กางข้าง',s:3,r:'12-15',t:'db'},
    {id:'d4c',n:'Front Raise',th:'ยกหน้า',s:3,r:'12',t:'db'},
    {id:'d4d',n:'Rear Delt Fly',th:'หลังไหล่',s:3,r:'15',t:'db'},
    {id:'d4e',n:'Bicep Curl',th:'เคิร์ลหน้าแขน',s:3,r:'12',t:'db'},
    {id:'d4f',n:'Triceps Kickback',th:'คิกแบ็ก',s:3,r:'12',t:'db'},
    {id:'d4g',n:'Shrugs',th:'ยักไหล่',s:3,r:'15',t:'db'},
  ]},
  5:{title:'Full Body + เผาไขมัน',tag:'Conditioning',ex:[
    {id:'d5a',n:'DB Thruster',th:'ทรัสเตอร์ สควอท+ดัน',s:4,r:'12',t:'db'},
    {id:'d5b',n:'Renegade Row',th:'เรเนเกดโรว์',s:3,r:'10',t:'db'},
    {id:'d5c',n:'DB Deadlift',th:'เดดลิฟต์',s:3,r:'12',t:'db'},
    {id:'d5d',n:'Burpees',th:'เบอร์ปี้',s:3,r:'12',t:'bw'},
    {id:'d5e',n:'Mountain Climbers',th:'ไต่เขา',s:3,r:'30',t:'time'},
    {id:'d5f',n:'DB Swing',th:'สวิงสะโพก',s:3,r:'15',t:'db'},
    {id:'d5g',n:'Plank',th:'แพลงก์',s:3,r:'45-60',t:'time'},
  ]},
};
const EX_BY_ID={};for(const d in PLAN)PLAN[d].ex.forEach(e=>EX_BY_ID[e.id]={...e,day:+d});

let state={view:'workout',day:1,data:{logs:{}}};

function tkey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(k){const[y,m,d]=k.split('-');const mo=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return `${+d} ${mo[+m-1]} ${(+y+543)%100}`}
function entries(id){return (state.data.logs[id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1)}
function todayEntry(id){return (state.data.logs[id]||[]).find(e=>e.date===tkey())}
function lastEntry(id){const e=entries(id).filter(x=>x.date!==tkey());return e[e.length-1]}
function ensureToday(id){if(!state.data.logs[id])state.data.logs[id]=[];let e=todayEntry(id);if(!e){e={date:tkey(),sets:[]};state.data.logs[id].push(e)}return e}
function volume(entry,type){if(!entry)return 0;return entry.sets.reduce((s,st)=>{if(!st.done)return s;const r=parseFloat(st.r)||0;if(type==='db'){const w=parseFloat(st.w)||0;return s+w*r}return s+r},0)}
function sumSetStr(entry,type){if(!entry||!entry.sets.length)return '';const done=entry.sets.filter(s=>s.done||s.r);if(!done.length)return '';if(type==='db'){const w=done[0].w||'?';const reps=done.map(s=>s.r||'0').join(',');return `${w} กก. × ${reps}`}return done.map(s=>s.r||'0').join(', ')+(type==='time'?' วิ':' ครั้ง')}

let saveTimer=null;
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state.data));
    const n=document.getElementById('savenote');n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),1300);
  }catch(e){console.error('save failed',e)}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
function load(){
  try{const v=localStorage.getItem(STORE_KEY);if(v){const d=JSON.parse(v);if(d&&d.logs)state.data=d}}
  catch(e){/* first run */}
}

function streak(){
  const dates=new Set();
  for(const id in state.data.logs)for(const e of state.data.logs[id])if(e.sets.some(s=>s.done))dates.add(e.date);
  if(!dates.size)return 0;
  const key=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  const has=k=>dates.has(k);
  let count=0;const d=new Date();
  if(!has(key(d))){d.setDate(d.getDate()-1);if(!has(key(d)))return 0}
  while(has(key(d))){count++;d.setDate(d.getDate()-1)}
  return count;
}

function setView(v){
  state.view=v;
  document.getElementById('tabWork').classList.toggle('on',v==='workout');
  document.getElementById('tabHist').classList.toggle('on',v==='history');
  document.getElementById('workoutView').style.display=v==='workout'?'':'none';
  document.getElementById('historyView').style.display=v==='history'?'':'none';
  if(v==='history')renderHistory();
}

function renderRail(){
  const rail=document.getElementById('rail');rail.innerHTML='';
  for(let d=1;d<=5;d++){
    const p=PLAN[d];
    const activeToday=p.ex.some(e=>{const t=todayEntry(e.id);return t&&t.sets.some(s=>s.done)});
    const el=document.createElement('div');
    el.className='daycard'+(d===state.day?' on':'');
    el.onclick=()=>{state.day=d;renderRail();renderDay()};
    el.innerHTML=`<div class="dn">DAY ${d}</div><div class="dt">${p.title}</div><div class="dtag">${p.tag}</div>${activeToday?'<div class="dot"></div>':''}`;
    rail.appendChild(el);
  }
}
function chkIcon(){return '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>'}

function renderDay(){
  const p=PLAN[state.day];
  document.getElementById('dayTitle').textContent=p.title;
  document.getElementById('dayCnt').textContent=`${p.ex.length} ท่า`;
  const list=document.getElementById('exList');list.innerHTML='';
  p.ex.forEach(ex=>list.appendChild(exCard(ex)));
}

function exCard(ex){
  const card=document.createElement('div');card.className='ex';card.dataset.id=ex.id;
  const last=lastEntry(ex.id);const lastStr=sumSetStr(last,ex.t);
  const today=todayEntry(ex.id);
  const nSets=Math.max(ex.s,today?today.sets.length:0);
  let rows='';
  for(let i=0;i<nSets;i++){
    const st=today&&today.sets[i]?today.sets[i]:{w:'',r:'',done:false};
    const ls=last&&last.sets[i]?last.sets[i]:null;
    const wPh=ls&&ls.w?ls.w:'';const rPh=ls&&ls.r?ls.r:(ex.t==='time'?'วิ':'');
    const wField=ex.t==='db'?`<div class="fld"><label>กก.</label><input type="number" inputmode="decimal" data-i="${i}" data-f="w" value="${st.w}" placeholder="${wPh}" step="0.5"></div><span class="x">×</span>`:'';
    const rLabel=ex.t==='time'?'วินาที':'ครั้ง';
    rows+=`<div class="setrow ${st.done?'done':''}" data-i="${i}">
      <div class="snum">${i+1}</div>
      <div class="fields">${wField}<div class="fld"><label>${rLabel}</label><input type="number" inputmode="numeric" data-i="${i}" data-f="r" value="${st.r}" placeholder="${rPh}"></div></div>
      <div class="chk" data-i="${i}">${chkIcon()}</div>
    </div>`;
  }
  const tv=volume(today,ex.t),lv=volume(last,ex.t);
  const doneCount=today?today.sets.filter(s=>s.done).length:0;
  const isPR=tv>0&&lv>0&&tv>lv&&doneCount>=ex.s;
  card.innerHTML=`
    <div class="ex-top">
      <div><div class="ex-name">${ex.n}</div><div class="ex-th">${ex.th}</div></div>
      <div class="ex-target">เป้าหมาย<b>${ex.s}×${ex.r}</b></div>
    </div>
    <div class="last"><span class="lg">ครั้งก่อน:</span> ${lastStr||'—'} ${isPR?'<span class="pr">🏆 ทำลายสถิติ!</span>':''}</div>
    <div class="sets">${rows}</div>
    <button class="addset">+ เพิ่มเซ็ต</button>`;
  card.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const i=+inp.dataset.i,f=inp.dataset.f;
      const e=ensureToday(ex.id);while(e.sets.length<=i)e.sets.push({w:'',r:'',done:false});
      e.sets[i][f]=inp.value;scheduleSave();updatePR(card,ex);
    });
  });
  card.querySelectorAll('.chk').forEach(chk=>{
    chk.addEventListener('click',()=>{
      const i=+chk.dataset.i;const e=ensureToday(ex.id);while(e.sets.length<=i)e.sets.push({w:'',r:'',done:false});
      e.sets[i].done=!e.sets[i].done;
      chk.closest('.setrow').classList.toggle('done',e.sets[i].done);
      scheduleSave();updatePR(card,ex);renderRailDot();document.getElementById('streakN').textContent=streak();
    });
  });
  card.querySelector('.addset').addEventListener('click',()=>{
    const e=ensureToday(ex.id);e.sets.push({w:'',r:'',done:false});
    const fresh=exCard(ex);card.replaceWith(fresh);scheduleSave();
  });
  return card;
}

function updatePR(card,ex){
  const today=todayEntry(ex.id),last=lastEntry(ex.id);
  const tv=volume(today,ex.t),lv=volume(last,ex.t);
  const doneCount=today?today.sets.filter(s=>s.done).length:0;
  const isPR=tv>0&&lv>0&&tv>lv&&doneCount>=ex.s;
  const lastEl=card.querySelector('.last');const existing=lastEl.querySelector('.pr');
  if(isPR&&!existing){const b=document.createElement('span');b.className='pr';b.textContent='🏆 ทำลายสถิติ!';lastEl.appendChild(b)}
  if(!isPR&&existing)existing.remove();
}
function renderRailDot(){
  document.querySelectorAll('#rail .daycard').forEach((c,idx)=>{
    const d=idx+1;const active=PLAN[d].ex.some(e=>{const t=todayEntry(e.id);return t&&t.sets.some(s=>s.done)});
    let dot=c.querySelector('.dot');
    if(active&&!dot){const el=document.createElement('div');el.className='dot';c.appendChild(el)}
    if(!active&&dot)dot.remove();
  });
}
function renderHistory(){
  const v=document.getElementById('historyView');const byDate={};
  for(const id in state.data.logs)for(const e of state.data.logs[id]){
    if(!e.sets.some(s=>s.done))continue;(byDate[e.date]=byDate[e.date]||[]).push({id,entry:e});
  }
  const dates=Object.keys(byDate).sort().reverse();
  if(!dates.length){v.innerHTML=`<div class="empty"><div class="ico">🏋️</div><b>ยังไม่มีประวัติ</b><p>เริ่มบันทึกเซ็ตแรกของคุณ<br>แล้วสถิติจะมาโชว์ที่นี่</p></div>`;return}
  v.innerHTML='';
  dates.forEach(date=>{
    const items=byDate[date];const dayCount={};
    items.forEach(it=>{const dy=EX_BY_ID[it.id].day;dayCount[dy]=(dayCount[dy]||0)+1});
    const dayNum=Object.keys(dayCount).sort((a,b)=>dayCount[b]-dayCount[a])[0];
    let total=0;const rows=[];
    items.forEach(it=>{const ex=EX_BY_ID[it.id];const vol=volume(it.entry,ex.t);total+=ex.t==='db'?vol:0;
      rows.push(`<div class="hex-row"><span>${ex.n}</span><span>${sumSetStr(it.entry,ex.t)||'—'}</span></div>`)});
    const card=document.createElement('div');card.className='hcard';
    card.innerHTML=`<div class="hd">
        <div><div class="hdate">${fmtDate(date)}</div><div class="hday">Day ${dayNum} · ${PLAN[dayNum].title}</div></div>
        <div class="hvol"><b>${Math.round(total).toLocaleString()}</b><small>kg volume</small></div>
      </div><div class="hex">${rows.join('')}</div>`;
    v.appendChild(card);
  });
}

// PWA install prompt (Android/desktop Chrome)
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=document.getElementById('installBtn');b.classList.add('show');});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;
  deferredPrompt=null;document.getElementById('installBtn').classList.remove('show');
});
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.remove('show')});

// register service worker for offline
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(function init(){load();document.getElementById('streakN').textContent=streak();renderRail();renderDay();})();
</script>
